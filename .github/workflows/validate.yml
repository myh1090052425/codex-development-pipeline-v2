name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source
        run: python3 scripts/validate.py
      - name: Test isolated installation
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          ./scripts/install.sh
          python3 scripts/validate.py --installed "$CODEX_HOME"
